    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0; padding: 1vh 2vw 7vh 2vw; 
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; height: 100dvh; height: 100svh; overflow: hidden; 
        }

        .header { text-align: center; margin-bottom: 1vh; flex-shrink: 0; }
        .header h1 { color: #38bdf8; margin: 0; text-transform: uppercase; letter-spacing: 1px; font-size: clamp(1.1rem, 2.5vh, 1.8rem); }
        .header p { color: #94a3b8; margin-top: 3px; font-size: clamp(0.75rem, 1.5vh, 0.95rem); }

        .interactive-container {
            position: relative; max-width: 1800px; width: 100%;
            flex-grow: 1; min-height: 0; display: flex;
            justify-content: center; align-items: center;
        }

        .aspect-wrapper {
            position: relative; 
            width: 100%; height: 100%; 
            max-width: 100%; max-height: 100%;
            aspect-ratio: 6561.51 / 3109.91; 
            border: 3px solid #1e293b; border-radius: 12px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8); background: #0f172a;
        }

        .overlay-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; overflow: visible; display: block; }

        /* ================= ANIMAȚII & FSM ================= */
        .ring, .usb-dome, .menu-hole, .button { fill: var(--color); pointer-events: none; transition: opacity 0.15s, filter 0.15s, fill 0.15s; }

        body:not(.master-off) .channel.hover-ring .ring { opacity: 1 !important; filter: drop-shadow(0 0 40px var(--color)) !important; }
        body:not(.master-off) .channel.hover-btn .button { opacity: 1 !important; filter: drop-shadow(0 0 25px var(--color)) !important; }

        body.master-off .ring, body.master-off .button, body.master-off .usb-dome, body.master-off .menu-hole { opacity: 0 !important; filter: none !important; }
        body.master-off .channel.hover-ring .ring { opacity: 0.8 !important; filter: drop-shadow(0 0 20px var(--color)) !important; }
        body.master-off .channel.hover-btn .button { opacity: 0.9 !important; filter: drop-shadow(0 0 20px var(--color)) !important; }
        body.master-off .channel.hover-atomizer .menu-hole { opacity: 0.6 !important; }
        body.master-off .usb-dome.hover-usb { opacity: 0.8 !important; filter: drop-shadow(0 0 20px #07FCFD) !important; }

        body.puffing .menu-hole:not(.active) { opacity: 0.05 !important; }
        body.puffing .channel:not(.active) .ring, body.puffing .channel:not(.active) .button, body.puffing .usb-dome { opacity: 0.15 !important; filter: none !important; }
        
        body.master-off.puffing .menu-hole.active, body.puffing .menu-hole.active { 
            opacity: 1 !important; animation: active-flash-opacity 0.1s infinite alternate !important; 
        }
        body.master-off.puffing .channel.active .ring, body.puffing .channel.active .ring { 
            opacity: 1 !important; filter: drop-shadow(0 0 60px var(--color)) drop-shadow(0 0 20px white) !important;
            animation: active-flash-opacity 0.1s infinite alternate !important; 
        }
        body.master-off.puffing .channel.active .button, body.puffing .channel.active .button { 
            opacity: 1 !important; filter: drop-shadow(0 0 40px var(--color)) drop-shadow(0 0 15px white) !important;
            animation: active-flash-opacity 0.1s infinite alternate !important; 
        }

        @keyframes active-flash-opacity { 0% { opacity: 0.4; } 100% { opacity: 1; } }
        
        .spray-group { opacity: 0; pointer-events: none; }
        body.puffing .channel.active .spray-group { opacity: 1 !important; }
        .mist-cone { transform-origin: 0px 0px; }
        body.puffing .channel.active .mist-cone { animation: shoot-mist 2s ease-out forwards; }

        @keyframes shoot-mist { 0% { transform: scale(0.2) translateY(0); opacity: 0; } 15% { opacity: 0.85; } 70% { opacity: 0.5; } 100% { transform: scale(1.8) translateY(-1000px); opacity: 0; } }

        .particle { fill: var(--color); filter: drop-shadow(0 0 20px var(--color)) drop-shadow(0 0 10px white); opacity: 0; }
        body.puffing .channel.active .p1 { animation: p-fly1 2s ease-out forwards; }
        body.puffing .channel.active .p2 { animation: p-fly2 2s 0.05s ease-out forwards; }
        body.puffing .channel.active .p3 { animation: p-fly3 2s 0.10s ease-out forwards; }
        body.puffing .channel.active .p4 { animation: p-fly4 2s 0.15s ease-out forwards; }
        body.puffing .channel.active .p5 { animation: p-fly5 2s 0.20s ease-out forwards; }
        body.puffing .channel.active .p6 { animation: p-fly6 1.5s 0.25s ease-out forwards; }
        body.puffing .channel.active .p7 { animation: p-fly7 1.6s 0.30s ease-out forwards; }
        body.puffing .channel.active .p8 { animation: p-fly8 1.5s 0.35s ease-out forwards; }

        @keyframes p-fly1 { 0% { transform: translate(0,0) scale(0); opacity: 1; } 100% { transform: translate(-250px, -900px) scale(1.5); opacity: 0; } }
        @keyframes p-fly2 { 0% { transform: translate(0,0) scale(0); opacity: 1; } 100% { transform: translate(300px, -1100px) scale(2.0); opacity: 0; } }
        @keyframes p-fly3 { 0% { transform: translate(0,0) scale(0); opacity: 1; } 100% { transform: translate(-150px, -1300px) scale(1.2); opacity: 0; } }
        @keyframes p-fly4 { 0% { transform: translate(0,0) scale(0); opacity: 1; } 100% { transform: translate(350px, -1000px) scale(1.8); opacity: 0; } }
        @keyframes p-fly5 { 0% { transform: translate(0,0) scale(0); opacity: 1; } 100% { transform: translate(-100px, -1500px) scale(2.5); opacity: 0; } }
        @keyframes p-fly6 { 0% { transform: translate(0,0) scale(0); opacity: 1; } 100% { transform: translate(150px, -1600px) scale(2.2); opacity: 0; } }
        @keyframes p-fly7 { 0% { transform: translate(0,0) scale(0); opacity: 1; } 100% { transform: translate(-350px, -1200px) scale(1.6); opacity: 0; } }
        @keyframes p-fly8 { 0% { transform: translate(0,0) scale(0); opacity: 1; } 100% { transform: translate(400px, -1800px) scale(2.8); opacity: 0; } }

        body.demo-puff-active .mist-cone, body.demo-puff-active .particle { display: none !important; }

        /* ================= ETICHETE & PANOU ================= */
        .label-text { opacity: 0; pointer-events: none; transition: opacity 0.2s ease, filter 0.2s ease; }
        .label-text.hovered { opacity: 1; fill: #ffffff !important; filter: drop-shadow(0 0 25px white) drop-shadow(0 0 10px white); }
        .hitbox { fill: transparent; stroke: transparent; cursor: pointer; pointer-events: auto; }

        #b1 { transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), fill 0.1s ease; cursor: pointer; pointer-events: all; touch-action: none; }
        #b1 { transform-origin: 5803.6px 1045.76px; }
        #b1:hover { fill: #ff3333; }
        #b1.pressed { transform: scale(0.92); fill: #b30000; }

        .toggle-btn { cursor: pointer; transition: fill 0.3s ease; pointer-events: auto; touch-action: none; }
        .toggle-btn:hover { filter: brightness(1.1); }
        .toggle-btn.off { fill: #661111; }
        .fade-element, .icon-on, .icon-off { transition: opacity 0.3s ease, fill 0.3s ease; }
        .icon-on, .icon-off { pointer-events: none; }
        #lcd_text_group { font-family: 'Share Tech Mono', monospace; font-size: 50px; }

        /* ================= TOOLTIP ================= */
        .tooltip-card {
            position: absolute; bottom: 2vh; left: 50%;
            transform: translateX(-50%) translateY(150px); 
            background: rgba(15, 23, 42, 0.95); padding: 15px 20px; border-radius: 8px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9); width: 80%; max-width: 500px;
            z-index: 100; opacity: 0; pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(5px); display: flex; align-items: flex-start; gap: 15px;
        }
        .tooltip-card.active { transform: translateX(-50%) translateY(0); opacity: 1; }
        .tooltip-tag {
            display: flex; align-items: center; justify-content: center;
            width: 42px; height: 42px; border-radius: 50%;
            border: 3px solid #000; color: #000; font-weight: 900; font-size: 16px;
            flex-shrink: 0; box-shadow: inset 0 0 5px rgba(255,255,255,0.4); background-color: #38bdf8;
        }
        .tooltip-tag.usb-shape { width: 75px; border-radius: 12px; font-size: 15px; }
        .tooltip-content { flex-grow: 1; }
        .tooltip-title { color: #f8fafc; font-weight: 800; font-size: 15px; margin: 0 0 6px 0; text-transform: uppercase; }
        .tooltip-desc { color: #cbd5e1; font-size: 14px; line-height: 1.4; margin: 0; }
        .tooltip-desc strong { color: #facc15; }

        /* ================= ECRAN AVERTIZARE (PORTRAIT) ================= */
        .rotate-message {
            display: none; flex-direction: column; justify-content: center; align-items: center;
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background-color: #0f172a; color: #38bdf8; z-index: 9999; text-align: center; padding: 20px;
        }
        .rotate-icon { margin-bottom: 30px; animation: tilt-phone 2.5s infinite ease-in-out; color: #f8fafc; }
        .rotate-message h2 { margin: 0 0 15px 0; font-size: 1.8rem; letter-spacing: 1px; }
        .rotate-message p { color: #94a3b8; font-size: 1.1rem; max-width: 320px; line-height: 1.5; margin: 0; }

        @keyframes tilt-phone { 
            0%, 20% { transform: rotate(0deg); } 
            80%, 100% { transform: rotate(-90deg); } 
        }

        @media screen and (max-width: 1000px) and (orientation: portrait) {
            .rotate-message { display: flex; }
            .header, .interactive-container { display: none !important; }
        }

        @media screen and (max-width: 1000px) and (orientation: landscape) {
            .header { display: none !important; }
            body { padding: 0 !important; height: 100svh !important; height: 100dvh !important; }
            .aspect-wrapper {
                position: relative; 
                width: 100%; height: auto; 
                max-width: 100%; max-height: 100%;
                aspect-ratio: 6561.51 / 3109.91; 
                border: none; 
                border-radius: 0; 
                box-shadow: none; 
                background: transparent;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            
            .tooltip-card { padding: 8px 12px; max-width: 320px; bottom: 3vh; gap: 10px; }
            .tooltip-tag { width: 32px; height: 32px; font-size: 12px; }
            .tooltip-tag.usb-shape { width: 50px; font-size: 11px; }
            .tooltip-title { font-size: 13px; margin-bottom: 4px; }
            .tooltip-desc { font-size: 11px; line-height: 1.2; }
        }
    </style>
</head>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            window.isInfoEnabled = true;
            
            const infoSwitchSvg = document.getElementById('info-switch-svg');
            const infoSvgTrack = document.getElementById('info-svg-track');
            const infoSvgThumb = document.getElementById('info-svg-thumb');

            function updateInfoSwitchVisuals() {
                if (window.isInfoEnabled) {
                    if(infoSvgTrack) infoSvgTrack.setAttribute("fill", "#38bdf8");
                    if(infoSvgThumb) infoSvgThumb.setAttribute("transform", "translate(45, 0)");
                } else {
                    if(infoSvgTrack) infoSvgTrack.setAttribute("fill", "#475569");
                    if(infoSvgThumb) infoSvgThumb.setAttribute("transform", "translate(0, 0)");
                }
            }

            if (infoSwitchSvg) {
                infoSwitchSvg.addEventListener('click', () => {
                    window.isInfoEnabled = !window.isInfoEnabled;
                    updateInfoSwitchVisuals();
                    if (!window.isInfoEnabled) {
                        document.getElementById('info-card').classList.remove('active');
                        clearAllHighlights(); 
                    }
                });
                updateInfoSwitchVisuals();
            }
            
            const mediaQuery = window.matchMedia("(max-width: 1000px) and (orientation: landscape)");
            
            function handleOrientationChange(e) {
                const mainSvg = document.querySelector('.overlay-svg');
                const panouBgRect = document.querySelectorAll('#panou-dreapta rect')[1]; 
                
                const lcdGrup = document.getElementById("lcd_grup_sus");
                const btnSus = document.getElementById("butoane_sus");
                const btnJos = document.getElementById("butoane_jos_master");
                const hitB1Hold = document.getElementById("hitbox_b1_hold");
                const infoSwitch = document.getElementById("info-switch-svg");
                const autBtn = document.getElementById("buton_master_automatizare");
                const ledBtn = document.getElementById("buton_master_led");
                const autPoly = document.getElementById("aut_polyline");
                const ledPoly = document.getElementById("led_polyline");

                if (e.matches) {
                    mainSvg.setAttribute("viewBox", "0 0 7561.51 3109.91"); 
                    if (panouBgRect) panouBgRect.setAttribute("width", "2034.7"); 
                    
                    if (lcdGrup) lcdGrup.setAttribute("transform", "translate(-6140, -380) scale(2.1)");
                    if (btnSus) btnSus.setAttribute("transform", "translate(-3100, -330) scale(1.6)");
                    if (hitB1Hold) hitB1Hold.setAttribute("transform", "translate(-3100, -330) scale(1.6)");
                    if (btnJos) btnJos.setAttribute("transform", "translate(-2900, -1800) scale(1.6)");

                    // Modificarea 1: Scalare mărită pentru switch INFO pe telefon
                    if (infoSwitch) infoSwitch.setAttribute("transform", "translate(150, 120) scale(1.35)");

                    // Modificarea 2: Redimensionare și recentrare butoane master pe axa LCD-ului (lățime = 104.8 referință B2)
                    if (autBtn && ledBtn) {
                        autBtn.setAttribute("width", "104.8");
                        autBtn.setAttribute("x", "5913.53");
                        ledBtn.setAttribute("width", "104.8");
                        ledBtn.setAttribute("x", "6038.33");
                        if(autPoly) autPoly.setAttribute("points", "6018.33,2774.27 5913.53,2774.27 5913.53,2617.24 6018.33,2617.24 6018.33,2774.27");
                        if(ledPoly) ledPoly.setAttribute("points", "6143.13,2774.27 6038.33,2774.27 6038.33,2617.24 6143.13,2617.24 6143.13,2774.27");
                    }
                } else {
                    mainSvg.setAttribute("viewBox", "0 0 6561.51 3109.91");
                    if (panouBgRect) panouBgRect.setAttribute("width", "1033.11");
                    
                    if (lcdGrup) lcdGrup.removeAttribute("transform");
                    if (btnSus) btnSus.removeAttribute("transform");
                    if (btnJos) btnJos.removeAttribute("transform");
                    if (hitB1Hold) hitB1Hold.removeAttribute("transform");

                    // Reset desktop
                    if (infoSwitch) infoSwitch.setAttribute("transform", "translate(180, 150)");
                    if (autBtn && ledBtn) {
                        autBtn.setAttribute("width", "74.44");
                        autBtn.setAttribute("x", "5933.93");
                        ledBtn.setAttribute("width", "74.44");
                        ledBtn.setAttribute("x", "6022.91");
                        if(autPoly) autPoly.setAttribute("points", "6008.37,2774.27 5933.93,2774.27 5933.93,2617.24 6008.37,2617.24 6008.37,2774.27");
                        if(ledPoly) ledPoly.setAttribute("points", "6097.34,2774.27 6022.9,2774.27 6022.9,2617.24 6097.34,2617.24 6097.34,2774.27");
                    }
                }
            }
            mediaQuery.addEventListener("change", handleOrientationChange);
            handleOrientationChange(mediaQuery);

            // Modificarea 3: Ascunderea automată a barei de adrese la primul tap pe ecran (mobil)
            document.addEventListener('touchstart', () => {
                if (window.innerWidth <= 1000 && !document.fullscreenElement) {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen().catch(() => {});
                    }
                }
            }, { once: true, passive: true });

            const triggers = document.querySelectorAll('.t-trigger');
            const infoCard = document.getElementById('info-card');
            const tTag = document.getElementById('t-tag');
            const tTitle = document.getElementById('t-title');
            const tDesc = document.getElementById('t-desc');
            const lcdRows = [
                document.getElementById("lcd-r0"), document.getElementById("lcd-r1"),
                document.getElementById("lcd-r2"), document.getElementById("lcd-r3")
            ];

            window.isTouchDevice = false;
            window.tooltipTimeout = null;
            document.addEventListener('touchstart', () => { window.isTouchDevice = true; }, {passive: true});

            function clearAllHighlights() { document.querySelectorAll('.label-text').forEach(t => t.classList.remove('hovered')); }
            function clearHoverEffects() {
                document.querySelectorAll('.channel').forEach(ch => ch.classList.remove('hover-ring', 'hover-btn', 'hover-atomizer'));
                document.querySelectorAll('.usb-dome').forEach(d => d.classList.remove('hover-usb'));
            }

            function toggleTextHighlight(tagStr, forceState) {
                const textElement = document.getElementById('txt-' + tagStr);
                if(textElement) {
                    if(forceState === true) { clearAllHighlights(); textElement.classList.add('hovered'); }
                    else if(forceState === false) { textElement.classList.remove('hovered'); }
                    else { textElement.classList.toggle('hovered'); }
                }
            }

            function showTooltip(type, channelNum) {
                let tagStr = "", colorHex = "#f8fafc", title = "", desc = "";
                tTag.classList.remove('usb-shape');

                const colors = { "1": "#FD5BFC", "2": "#45EBA9", "3": "#05FFF3", "4": "#FB8D50" };
                if (colors[channelNum]) colorHex = colors[channelNum];

                switch(type) {
                    case "atomizer":
                        tagStr = "A" + channelNum; title = "Atomizor Canal " + channelNum;
                        desc = "Orificiul de expulzare a jetului de parfum. Puteți face click aici pentru un puf.";
                        break;
                    case "ring":
                        tagStr = "I" + channelNum; title = "Inel LED Adresabil " + channelNum;
                        desc = "Oferă feedback vizual luminos. Își reduce intensitatea în timpul pulverizării altor canale.";
                        break;
                    case "button":
                        tagStr = "C" + channelNum; title = "Buton Declanșare " + channelNum;
                        desc = "<strong>Apăsați butonul pentru acționare puf.</strong>";
                        break;
                    case "usb":
                        tagStr = "USB"; colorHex = "#07FCFD"; title = "Lumină Accent USB";
                        tTag.classList.add('usb-shape');
                        desc = "Iluminare pulsantă de fundal sincronizată strict cu scenariul de standby.";
                        break;
                    case "b1_hold":
                        tagStr = "B1''"; colorHex = "#FA0A0A"; title = "Buton B1 (HOLD)";
                        desc = "Apăsați pentru simulare buton ținut apăsat - valabil pentru scenariul party.";
                        break;
                    case "lcd":
                        tagStr = "LCD"; colorHex = "#38bdf8"; title = "AFIȘAJ STATUS SISTEM";
                        tTag.classList.add('usb-shape');
                        desc = "Monitorizează aparatul în timp real. Oferă feedback despre starea sistemului, contorul pufurilor rămase și instrucțiuni pas cu pas.";
                        break;
                    case "b1":
                        tagStr = "B1"; colorHex = "#FA0A0A"; title = "BUTON B1";
                        desc = "Buton multifuncțional";
                        break;
                    case "b2":
                        tagStr = "B2"; colorHex = "#FF1100"; title = "COMUTATOR SIGURANȚĂ B2";
                        desc = "Controlează accesul la funcțiile aparatului. Trecerea pe <strong>OFF</strong> blochează pulverizarea sau trece sistemul în Demo Mode la initializare.";
                        break;
                    case "master_aut":
                        tagStr = "AUT"; colorHex = "#E53224"; title = "Comutator automatizare";
                        tTag.classList.add('usb-shape');
                        desc = "Pornește sau oprește complet partea de automatizare si control.";
                        break;
                    case "master_led":
                        tagStr = "LED"; colorHex = "#E53224"; title = "Comutator LED";
                        tTag.classList.add('usb-shape');
                        desc = "Controlează iluminarea furtunului LED și a logo-ului aparatului, independent de funcțiile de pulverizare.";
                        break;
                }

                if(type !== "b1_hold" && tagStr !== "") toggleTextHighlight(tagStr, true);

                if (!window.isInfoEnabled) return;

                tTitle.textContent = title; tDesc.innerHTML = desc;
                tTag.textContent = tagStr; tTag.style.backgroundColor = colorHex;
                infoCard.classList.add('active');

                if (window.isTouchDevice) {
                    if (window.tooltipTimeout) clearTimeout(window.tooltipTimeout);
                    window.tooltipTimeout = setTimeout(() => {
                        infoCard.classList.remove('active');
                        clearAllHighlights(); 
                    }, 3000);
                }
            }

            triggers.forEach(trigger => {
                const type = trigger.getAttribute('data-type');
                const channelNum = trigger.getAttribute('data-ch');
                const channelGroup = document.getElementById('ch' + channelNum);
                const maskHole = document.getElementById('mask-m' + channelNum);

                const handleHover = (e) => {
                    if(window.puffingChannel !== -1) return; 
                    clearHoverEffects(); showTooltip(type, channelNum);
                    if (channelGroup) {
                        if (type === "ring") channelGroup.classList.add('hover-ring');
                        else if (type === "button") channelGroup.classList.add('hover-btn');
                        else if (type === "atomizer") channelGroup.classList.add('hover-atomizer');
                    }
                    if (type === "usb") document.querySelectorAll('.usb-dome').forEach(d => d.classList.add('hover-usb'));
                };

                trigger.addEventListener('mouseenter', handleHover);
                trigger.addEventListener('mouseleave', () => { infoCard.classList.remove('active'); clearHoverEffects(); clearAllHighlights(); });
                
                trigger.addEventListener('touchstart', (e) => {
                    if(window.puffingChannel !== -1) return;
                    clearHoverEffects();
                    
                    const allowedTypes = ["hitbox", "usb", "ring", "lcd", "b1", "b2", "master_aut", "master_led"];
                    if (trigger.classList.contains('hitbox') || allowedTypes.includes(type)) {
                        const noPreventDefault = ["button", "atomizer", "b1_hold", "b1", "b2", "master_aut", "master_led"];
                        if (!noPreventDefault.includes(type)) {
                            e.preventDefault(); 
                        }
                        
                        clearAllHighlights(); showTooltip(type, channelNum);
                        if (channelGroup) {
                            if(type === "ring") channelGroup.classList.add('hover-ring');
                            else if(type === "button") channelGroup.classList.add('hover-btn');
                        }
                    }
                });

                trigger.addEventListener('click', () => {
                    if(window.puffingChannel !== -1) return; 
                    
                    if ((type === "atomizer" || type === "button") && channelGroup) {
                        let chIndex = parseInt(channelNum) - 1;

                        else if (elapsed < 25000) { abcd = "meniu"; mnpo = "FadeIn-FadeOut"; }
                        else { abcd = "Toate zonele"; mnpo = ""; }

                        updateLCD(window.demoModeActive ? `INIT DEMO: ${remSec}s` : `initializare: ${remSec}s`, "Verif.zona:", `${abcd.padEnd(12, " ")} (B1:x${Math.max(0, 3 - window.b1Presses)})`, mnpo);
                    }
                } 
                else if (window.fsmState === "SPJ_ACTIVE") {
                    let pulseState = Math.floor(now / 300) % 2 === 0;
                    let c1 = window.pumpPurged[0] ? '1' : (pulseState ? '1' : ' '), c2 = window.pumpPurged[1] ? '2' : (pulseState ? '2' : ' ');
                    let c3 = window.pumpPurged[2] ? '3' : (pulseState ? '3' : ' '), c4 = window.pumpPurged[3] ? '4' : (pulseState ? '4' : ' ');
                    updateLCD(`PURJARE    | ${c1} ${c2} ${c3} ${c4}`, "Ap. btn. C1,C2,C3,C4", `pt. reumpl. B1: x${Math.max(1, 3 - window.b1Presses)}  `, "pt. anulare B1: x1  ");
                }
                else if (window.fsmState === "SBOFF" || window.fsmState === "SOFF") {
                    updateLCD("Sistem Spray INACTIV", `A1:   ${window.puffs[0]}p  A3:   ${window.puffs[2]}p`, `A2:   ${window.puffs[1]}p  A4:   ${window.puffs[3]}p`, window.fsmState === "SBOFF" ? "ACCES BLOCAT!       " : "deblocati B2        ");
                }
                else if (window.fsmState === "SN") {
                    if (window.puffingChannel !== -1) {
                        let r0 = window.demoModeActive ? "     DEMO MODE      " : (window.partyModeActive ? "Sistem Spray [PARTY]" : "Sistem Spray ACTIV  ");
                        if (window.showModeActive && window.demoModeActive) r0 = "*****DEMO MODE******";
                        
                        let r1 = "Se actioneaza spray ";
                        const labels = {"1": "A1 - Roz", "2": "A2 - Verde", "3": "A3 - Cyan", "4": "A4 - Orange"};
                        let r2 = `Atomizor ${labels[window.puffingChannel] || "Stins"}`.padEnd(20, " ");
                        let r3 = "Faza: Atomizor ACTIV";
                        updateLCD(r0, r1, r2, r3);
                    }
                    else if (window.demoModeActive) {
                        if (window.b1Presses >= 3) {
                            window.b1Presses = 0; window.showModeActive = !window.showModeActive; window.demoShowRunning = window.showModeActive;
                            if (window.showModeActive) window.demoShowStart = now;
                        }
                        let r0 = window.showModeActive ? "*****DEMO MODE******" : "     DEMO MODE      ", r1 = " Sist.Spray INACTIV ", r2 = window.showModeActive ? "" : " SHOW- but. B1 x3   ", r3 = " EXIT- but. B2 - ON ";
                        if (window.showModeActive) {
                            if (window.demoShowRunning) r1 = `Show:${Math.max(1, 16 - Math.floor((now - window.demoShowStart) / 1000))}s/Pauza ${Math.floor(window.DEMO_PAUSE_DURATA / 60000)}m `.padEnd(20, " ");
                            else r1 = `Show:16s/Pauza ${Math.floor((((window.DEMO_PAUSE_DURATA > (now - window.demoPauseStart)) ? (window.DEMO_PAUSE_DURATA - (now - window.demoPauseStart)) : 0) + 59999) / 60000)}m `.padEnd(20, " ");
                            let msg = "apasa but. B1 x3        ", pos = Math.floor(now / 250) % msg.length, movingStr = "";
                            for (let i = 0; i < 8; i++) movingStr += msg.charAt((pos + i) % msg.length);
                            r2 = "Exit SHOW - " + movingStr;
                        } else if (window.b1Presses > 0) {
                            r3 = `B1 Toggle: x${Math.floor(now / 250) % 2 === 0 ? window.b1Presses : " "}      `;
                        }
                        updateLCD(r0, r1, r2, r3);
                    } 
                    else {
                        if (window.b1Presses >= 3 && window.isB2On && !window.purjarePending) {
                            window.b1Presses = 0; window.purjarePending = true; window.purjarePendingStart = now; return;
                        }
                        if (window.purjarePending && now - window.purjarePendingStart >= 1000) {
                            window.purjarePending = false; window.b1Presses = 0; window.bpWindowStart = now; 
                            window.fsmState = "SPJ_ACTIVE"; window.fsmStart = now; window.pumpPurged = [false, false, false, false]; window.purjareIntrerupta = false; return; 
                        }
                        
                        let r0 = window.partyModeActive ? "Sistem Spray [PARTY]" : "Sistem Spray ACTIV  ";
                        let r1 = `A1:   ${window.puffs[0]}p  A3:   ${window.puffs[2]}p`;
                        let r2 = `A2:   ${window.puffs[1]}p  A4:   ${window.puffs[3]}p`;
                        let r3 = "";

                        if (window.b1Presses > 0 || window.purjarePending) {
                            r3 = `Purjare B1:x3 - ${Math.floor(now / 250) % 2 === 0 ? (window.purjarePending ? 3 : window.b1Presses) : " "}  `;
                        } else {
                            const scrollText = " Pt. Purjare / Reumplere apasati butonul B1 ";
                            let pos = Math.floor(now / 250) % scrollText.length;
                            for (let i = 0; i < 20; i++) r3 += scrollText.charAt((pos + i) % scrollText.length);
                        }
                        updateLCD(r0, r1, r2, r3);
                    }
                }
            }, 150); 
        });
    </script>
</body>
</html>
